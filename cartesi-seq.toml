# Cartesi CLI (2.0.0-alpha.38) configuration for the sequencer variant of qa-wallet-app
# (`cartesi build -c cartesi-seq.toml`; the classic variant is cartesi.toml). See docs/sequencer.md.
# Same drives, env and state layout as the classic variant, plus the `config` NVRAM holding the
# batch submitter address and the accounts-drive token, and the qa-wallet-seq binary (app-seq
# target) as the entrypoint.
#
# The state lives in one 64 MiB NVRAM (/dev/uio0: a UIO range, no page cache, no filesystem): the
# accounts drive + single-asset ledger in its first 32 MiB, every other asset after that, then the
# meta page and the nonce table (docs/accounts-drive.md). `cartesi build` builds the root/app
# drives, boots the machine with the NVRAM declared in [nvrams.state] and stores the template in
# .cartesi/image. The emulator places NVRAMs after the last flash drive, each aligned to its own
# length, so [withdrawal.config].accounts_drive_start_index (= NVRAM start >> 22) can only be
# checked after a build: docs/build.md has the one-liner.

[machine]
entrypoint = "/mnt/app/qa-wallet-seq /dev/uio0 /dev/uio1"
ram_length = "128Mi"
use_docker_env = false

[machine.env]
# rollups-contracts v3.0.0-alpha.10 devnet addresses (`cartesi address-book`). On another chain
# set the portals and the token for that deployment; TestUsdc is the devnet USD token that the
# TestUsdWithdrawalOutputBuilder pays out. The CLI devnet also ships TestToken (ERC-20, 18 dec).
QA_TOKEN = "0x7a051EDffC0884cd88d4a377F4C87BE074CF6c81"
QA_ETHER_PORTAL = "0x035b11Be55656c6cfC822D1CaE568C1Af2e497b0"
QA_ERC20_PORTAL = "0x3332DE61a8BB9aC84893b2f552Fe81C9a6dC5419"
QA_ERC721_PORTAL = "0x397c352d18DFf47CC8a6143403142cf7afd5Ff7E"
QA_ERC1155_SINGLE_PORTAL = "0x585F56351A66f131E176a345662215C772f80451"
QA_ERC1155_BATCH_PORTAL = "0xee33550a22e3Cf6Cc265524dC9bcfD99D2307EBe"
QA_LOG = "1"

[drives.root]
builder = "docker"
dockerfile = "Dockerfile"
target = "base"
format = "ext2"
extra_size = "2Mb"

# The CLI always has an `app` drive; here it holds qa-wallet-seq (target app-seq). Both configs
# share .cartesi/, so a build of one variant replaces the other's app.sqfs and image.
[drives.app]
builder = "docker"
dockerfile = "Dockerfile"
target = "app-seq"
format = "sqfs"

# The state NVRAM: 64 MiB, /dev/uio0, owned by the app user. Being 64 MiB long it is 64 MiB-aligned
# by the emulator, so its 4 MiB accounts-drive prefix is a whole Merkle subtree that can be proved.
[nvrams.state]
size = "64Mi"
user = "dapp"

# The config NVRAM: 4 KiB, /dev/uio1: bytes 0..20 the batch submitter address, bytes 20..40 the
# accounts-drive ERC-20 (zero = QA_TOKEN / the devnet TestUsdc), the rest zero. `make
# seq/config-devnet.bin` writes the devnet one (anvil account 9, TestUsdc); a deployment replaces
# this range in the cycle-0 image (docs/sequencer.md).
[nvrams.config]
size = "4Ki"
user = "dapp"
filename = "seq/config-devnet.bin"

[withdrawal.config]
guardian = "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"   # anvil account 0
log2_leaves_per_account = 0
log2_max_num_of_accounts = 17
accounts_drive_start_index = 560   # = `state` NVRAM start (0x8c000000) >> 22; check after every build (docs/build.md)
withdrawal_output_builder = "0xB4D253c7a110241561B3eD6d632846dF7d4e9Af7"   # TestUsdWithdrawalOutputBuilder (devnet)
