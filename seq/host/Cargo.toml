[package]
name = "qawallet-seq-host"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The Cartesi sequencer with the qa-wallet engine linked through the application-engine C ABI"

[[bin]]
name = "qa-wallet-sequencer"
path = "src/main.rs"

[dependencies]
c-app-sequencer = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
