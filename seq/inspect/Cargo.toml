[package]
name = "qawallet-seq-inspect"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Follows the Cartesi sequencer's feed with its own qa-wallet engine and answers inspects"

[[bin]]
name = "qa-wallet-inspect"
path = "src/main.rs"

[dependencies]
c-app-engine = { workspace = true }
sequencer-core = { workspace = true }
alloy-primitives = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time", "sync", "net", "fs", "io-util"] }
axum = "0.8"
tokio-tungstenite = "0.29"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false }
tar = { version = "0.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
